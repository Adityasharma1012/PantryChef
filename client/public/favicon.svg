<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D34528"/>
      <stop offset="100%" stop-color="#9C2714"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#E59500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B1209" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner plate circle -->
  <circle cx="256" cy="260" r="190" fill="#FDFBF7" opacity="0.08"/>
  <circle cx="256" cy="260" r="170" fill="#FDFBF7" opacity="0.12"/>

  <!-- Cloche / Chef dome -->
  <g filter="url(#shadow)">
    <!-- Steam waves -->
    <path d="M210 120 C205 100 220 90 215 70" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M256 110 C250 85 270 75 260 55" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M302 120 C295 100 310 90 305 70" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Cloche knob -->
    <circle cx="256" cy="155" r="22" fill="url(#goldGrad)"/>
    <rect x="250" y="170" width="12" height="15" fill="url(#goldGrad)"/>

    <!-- Cloche dome -->
    <path d="M120 300 C120 190 180 180 256 180 C332 180 392 190 392 300 Z" fill="#FDFBF7"/>

    <!-- Cloche bottom rim tray -->
    <rect x="96" y="295" width="320" height="24" rx="12" fill="url(#goldGrad)"/>

    <!-- Basil Leaf Accent -->
    <path d="M256 220 C280 210 300 230 290 255 C270 265 245 245 256 220 Z" fill="#2D6A4F"/>
    <path d="M256 220 C240 212 225 228 232 248 C248 255 265 240 256 220 Z" fill="#52B788"/>
    <path d="M256 220 L256 260" stroke="#1B4332" stroke-width="3" stroke-linecap="round"/>

    <!-- Fork & Knife crossed below or tray base -->
    <rect x="150" y="325" width="212" height="10" rx="5" fill="#FDFBF7" opacity="0.6"/>
  </g>
</svg>