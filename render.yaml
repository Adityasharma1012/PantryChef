services:
  - type: web
    name: pantrychef
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: USE_MOCK_GEMINI
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
